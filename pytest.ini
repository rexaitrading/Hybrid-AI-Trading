[pytest]
testpaths = tests
norecursedirs =
    .git
    .venv
    venv
    env
    build
    dist
    site-packages
    scratch
    tools
addopts =
    -ra
    --strict-markers
python_files = test_*.py

markers =
    slow: long-running tests
    db: database-dependent tests
    uses_network: network-dependent tests
    mpl_image_compare: matplotlib image compare tests