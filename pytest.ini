[pytest]
testpaths = tests
addopts =
    -ra
    --ignore=.venv
    --ignore=.venv.bak_*
    --ignore=scratch
    --ignore=build
    --ignore=dist
    --ignore=.eggs
    --ignore=.mypy_cache
    --ignore=.pytest_cache
    --ignore-glob=**/site-packages/**
    --ignore-glob=**/*.bak_*
python_files = test_*.py
norecursedirs =
    .venv
    .venv.*
    scratch
    build
    dist
    site-packages
filterwarnings =
    ignore::DeprecationWarning